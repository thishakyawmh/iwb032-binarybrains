name: Ballerina CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ballerina-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ballerina-ci.yml"

permissions:
  contents: read

concurrency:
  group: ballerina-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Ballerina 2201.10.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: "2201.10.1"

      - name: Cache Ballerina dependencies
        uses: actions/cache@v4
        with:
          path: ~/.ballerina
          key: ballerina-${{ runner.os }}-${{ hashFiles('backend/Ballerina.toml', 'backend/Dependencies.toml') }}
          restore-keys: |
            ballerina-${{ runner.os }}-

      - name: Verify Ballerina distribution
        run: bal version

      - name: Run Ballerina tests
        run: bal test

      - name: Build Ballerina project
        run: bal build
